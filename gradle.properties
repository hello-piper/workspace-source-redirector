# IntelliJ platform version used for compilation; it also determines how low since-build can go.
# 2023.1 = build 231. To support the local 2025.3 only, change this to 2025.3.
platformVersion=2023.1.5

# Path to the locally installed IDE; verifyPlugin uses it to check that newer versions still work.
localIdePath=/Applications/IntelliJ IDEA.app

# The build JVM must be 17+ (Gradle 9 requirement). Reuse the JBR 21 bundled with the IDE
# so no separate JDK has to be installed.
org.gradle.java.home=/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
