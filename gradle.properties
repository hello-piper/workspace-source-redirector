# 编译所对着的 IntelliJ 平台版本，同时决定 since-build 能降到多低
# 2023.1 = build 231；想只认本机 2025.3，就改成 2025.3
platformVersion=2023.1.5

# 本机 IDEA 路径，verifyPlugin 用它校验"在新版本上还能不能跑"
localIdePath=/Applications/IntelliJ IDEA.app

# 构建 JVM 必须是 17+（Gradle 9 的要求），这里直接复用 IDEA 自带的 JBR 21，省得另装 JDK
org.gradle.java.home=/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
